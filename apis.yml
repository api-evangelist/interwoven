description: 'Interwoven, Inc. (NASDAQ: IWOV) was an enterprise content management software company
  founded in 1995 whose flagship products were TeamSite web content management and WorkSite document
  management, with a strong presence in the legal sector. Accel backed the company circa 1998; it IPO''d,
  and was acquired by Autonomy Corporation in 2009 (Autonomy in turn acquired by HP in 2011; TeamSite and
  related products later went to OpenText in 2016). The company is DEFUNCT: interwoven.com no longer serves
  HTTP/HTTPS and there is no live API, developer portal, or documentation surface to enrich. This entry is
  a false-positive lead from harvesting Accel''s historic portfolio and should be skipped by the enrichment
  pipeline.'
